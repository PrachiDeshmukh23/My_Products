<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Admin Dashboard – PlantCare Fertilizers</title>
  <link rel="stylesheet" href="../css/global.css" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Poppins:wght@400;600;700;800&display=swap" rel="stylesheet" />
  <script src="https://cdn.jsdelivr.net/npm/qrcode@1.5.3/build/qrcode.min.js"></script>
</head>
<body>
<script>
  if (!sessionStorage.getItem('pc_admin')) window.location.href = 'login.html';
</script>

<div class="admin-layout">
  <!-- SIDEBAR -->
  <aside class="admin-sidebar">
    <div class="sidebar-brand">
      <img src="../public/images/plantcare-logo.png" alt="Logo" class="sidebar-logo" />
      <div>
        <div class="sidebar-title">PlantCare</div>
        <div class="sidebar-subtitle">Admin Panel</div>
      </div>
    </div>
    <nav class="sidebar-nav">
      <button class="sidebar-link active" id="nav-dashboard" onclick="showSection('dashboard')">
        <span class="sidebar-link-icon">📊</span> Dashboard
      </button>
      <button class="sidebar-link" id="nav-products" onclick="showSection('products')">
        <span class="sidebar-link-icon">🌿</span> Products
      </button>
      <button class="sidebar-link" id="nav-qr" onclick="showSection('qr')">
        <span class="sidebar-link-icon">⬛</span> QR Management
      </button>
      <button class="sidebar-link" id="nav-analytics" onclick="showSection('analytics')">
        <span class="sidebar-link-icon">📈</span> Analytics
      </button>
      <a href="../index.html" class="sidebar-link" id="nav-view-site">
        <span class="sidebar-link-icon">🌐</span> View Site
      </a>
    </nav>
    <div class="sidebar-logout">
      <button class="btn btn-outline" style="width:100%;color:#fff;border-color:rgba(255,255,255,0.3);" id="logout-btn" onclick="logout()">Logout</button>
    </div>
  </aside>

  <!-- MAIN -->
  <main class="admin-main">
    <div class="admin-topbar">
      <span class="admin-topbar-title" id="topbar-title">Dashboard</span>
      <span style="font-size:0.85rem;color:#7a9880;">Welcome, Admin</span>
    </div>
    <div class="admin-content">

      <!-- DASHBOARD -->
      <section class="admin-section active" id="section-dashboard">
        <div class="stats-row">
          <div class="stat-card"><div class="stat-card-number">4</div><div class="stat-card-label">Total Products</div></div>
          <div class="stat-card"><div class="stat-card-number">4</div><div class="stat-card-label">QR Codes Active</div></div>
          <div class="stat-card"><div class="stat-card-number" id="total-scans">0</div><div class="stat-card-label">Total QR Scans</div></div>
          <div class="stat-card"><div class="stat-card-number">✅</div><div class="stat-card-label">License Valid</div></div>
        </div>
        <div class="admin-table-wrap">
          <table class="admin-table">
            <thead><tr><th>Product</th><th>Image</th><th>MRP</th><th>Weight</th><th>Status</th><th>Actions</th></tr></thead>
            <tbody id="dashboard-table-body"></tbody>
          </table>
        </div>
      </section>

      <!-- PRODUCTS -->
      <section class="admin-section" id="section-products">
        <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:24px;">
          <h2 style="font-family:Poppins,sans-serif;color:var(--dark-green);font-size:1.2rem;">Product Management</h2>
          <button class="btn btn-primary" id="btn-add-product" onclick="openAddModal()">+ Add Product</button>
        </div>
        <div class="admin-table-wrap">
          <table class="admin-table">
            <thead><tr><th>Image</th><th>Name</th><th>MRP</th><th>Weight</th><th>URL</th><th>Actions</th></tr></thead>
            <tbody id="products-table-body"></tbody>
          </table>
        </div>
      </section>

      <!-- QR MANAGEMENT -->
      <section class="admin-section" id="section-qr">
        <h2 style="font-family:Poppins,sans-serif;color:var(--dark-green);font-size:1.2rem;margin-bottom:24px;">QR Code Management</h2>
        <div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:24px;" id="qr-grid"></div>
      </section>

      <!-- ANALYTICS -->
      <section class="admin-section" id="section-analytics">
        <h2 style="font-family:Poppins,sans-serif;color:var(--dark-green);font-size:1.2rem;margin-bottom:24px;">Analytics &amp; Reports</h2>
        <div class="stats-row" id="analytics-stats"></div>
        <div class="admin-table-wrap">
          <table class="admin-table">
            <thead><tr><th>Product</th><th>URL</th><th>QR Scans</th><th>Last Scan</th></tr></thead>
            <tbody id="analytics-table-body"></tbody>
          </table>
        </div>
      </section>
    </div>
  </main>
</div>

<!-- ADD/EDIT MODAL -->
<div class="modal-overlay" id="product-modal">
  <div class="modal">
    <h3 class="modal-title" id="modal-title">Add Product</h3>
    <div class="form-group">
      <label class="form-label">Product Name</label>
      <input type="text" id="modal-name" class="form-input" placeholder="e.g. Sugarcane Special" />
    </div>
    <div class="form-group">
      <label class="form-label">Description</label>
      <textarea id="modal-desc" class="form-input" rows="3" placeholder="Product description..." style="resize:vertical;"></textarea>
    </div>
    <div class="form-group">
      <label class="form-label">MRP (₹)</label>
      <input type="number" id="modal-mrp" class="form-input" placeholder="e.g. 1480" />
    </div>
    <div class="form-group">
      <label class="form-label">Bag Weight (KG)</label>
      <input type="number" id="modal-weight" class="form-input" placeholder="e.g. 50" />
    </div>
    <div class="form-group">
      <label class="form-label">Product URL Slug</label>
      <input type="text" id="modal-slug" class="form-input" placeholder="e.g. sugarcane-special" />
    </div>
    <div class="modal-footer">
      <button class="btn btn-outline" style="color:var(--text-mid);border:1.5px solid var(--border);" onclick="closeModal()">Cancel</button>
      <button class="btn btn-primary" id="modal-save-btn" onclick="saveProduct()">Save Product</button>
    </div>
  </div>
</div>

<script>
// PRODUCTS DATA (localStorage-backed)
const DEFAULT_PRODUCTS = [
  { id:1, name:'Sugarcane Special', desc:'Organic fertilizer specially developed for Sugarcane crops for healthy root growth and higher yield.', mrp:1480, weight:50, slug:'sugarcane-special', img:'../public/images/sugarcane-special-front.png', scans: Math.floor(Math.random()*120)+30 },
  { id:2, name:'Onion & Corn', desc:'Organic nutrient fertilizer for Onion and Corn crops to improve productivity and soil health.', mrp:1460, weight:50, slug:'onion-corn', img:'../public/images/onion-maize-front.png', scans: Math.floor(Math.random()*90)+20 },
  { id:3, name:'Soybean & Cotton', desc:'Microbial organic fertilizer for Soybean and Cotton crops supporting nutrient absorption and root development.', mrp:1490, weight:50, slug:'soybean-cotton', img:'../public/images/soybean-cotton-front.png', scans: Math.floor(Math.random()*80)+15 },
  { id:4, name:'Crop Shakti', desc:'Advanced organic growth promoter enriched with humates, amino acids, seaweed extract, and fulvic acid.', mrp:1560, weight:25, slug:'crop-shakti', img:'../public/images/crop-shakti-front.png', scans: Math.floor(Math.random()*100)+40 }
];

function getProducts() {
  const stored = localStorage.getItem('pc_products');
  return stored ? JSON.parse(stored) : DEFAULT_PRODUCTS;
}
function saveProducts(products) {
  localStorage.setItem('pc_products', JSON.stringify(products));
}

let editId = null;

function showSection(name) {
  document.querySelectorAll('.admin-section').forEach(s => s.classList.remove('active'));
  document.querySelectorAll('.sidebar-link').forEach(l => l.classList.remove('active'));
  document.getElementById('section-' + name).classList.add('active');
  document.getElementById('nav-' + name).classList.add('active');
  document.getElementById('topbar-title').textContent = name.charAt(0).toUpperCase() + name.slice(1);
  if (name === 'dashboard') renderDashboard();
  if (name === 'products') renderProducts();
  if (name === 'qr') renderQR();
  if (name === 'analytics') renderAnalytics();
}

function renderDashboard() {
  const products = getProducts();
  const totalScans = products.reduce((a,p) => a + p.scans, 0);
  document.getElementById('total-scans').textContent = totalScans;
  const tbody = document.getElementById('dashboard-table-body');
  tbody.innerHTML = products.map(p => `
    <tr>
      <td><strong>${p.name}</strong></td>
      <td><img src="${p.img}" class="product-thumb" alt="${p.name}" /></td>
      <td>₹${p.mrp.toLocaleString()}</td>
      <td>${p.weight} KG</td>
      <td><span class="badge-active">Active</span></td>
      <td>
        <button class="action-btn edit" onclick="openEditModal(${p.id})">Edit</button>
        <button class="action-btn qr" onclick="showSection('qr')">QR</button>
      </td>
    </tr>
  `).join('');
}

function renderProducts() {
  const products = getProducts();
  const tbody = document.getElementById('products-table-body');
  tbody.innerHTML = products.map(p => `
    <tr>
      <td><img src="${p.img}" class="product-thumb" alt="${p.name}" /></td>
      <td><strong>${p.name}</strong><br/><span style="font-size:0.78rem;color:#7a9880;">${p.desc.substring(0,50)}...</span></td>
      <td>₹${p.mrp.toLocaleString()}</td>
      <td>${p.weight} KG</td>
      <td style="font-size:0.78rem;color:var(--sky-blue);">...com/products/${p.slug}</td>
      <td>
        <button class="action-btn edit" onclick="openEditModal(${p.id})">Edit</button>
        <button class="action-btn delete" onclick="deleteProduct(${p.id})">Delete</button>
      </td>
    </tr>
  `).join('');
}

function renderQR() {
  const products = getProducts();
  const grid = document.getElementById('qr-grid');
  grid.innerHTML = products.map(p => `
    <div class="info-card" style="text-align:center;">
      <div class="info-card-title" style="justify-content:center;">${p.name}</div>
      <div class="qr-canvas-wrap" style="margin:16px auto;display:inline-flex;">
        <canvas id="qr-${p.id}" width="160" height="160"></canvas>
      </div>
      <p style="font-size:0.75rem;color:#7a9880;margin:8px 0 16px;word-break:break-all;">plantcarefertilizers.com/products/${p.slug}</p>
      <div style="display:flex;gap:8px;justify-content:center;flex-wrap:wrap;">
        <button class="action-btn qr" onclick="downloadAdminQR(${p.id},'${p.slug}')">⬇ PNG</button>
        <button class="action-btn edit" onclick="copyProductLink('${p.slug}')">🔗 Copy</button>
      </div>
    </div>
  `).join('');
  // Render QR codes
  products.forEach(p => {
    const url = 'https://plantcarefertilizers.com/products/' + p.slug;
    QRCode.toCanvas(document.getElementById('qr-' + p.id), url, { width: 160, margin: 2, color: { dark: '#1F5E2E', light: '#FFFFFF' } });
  });
}

function renderAnalytics() {
  const products = getProducts();
  const totalScans = products.reduce((a,p) => a + p.scans, 0);
  const statsDiv = document.getElementById('analytics-stats');
  statsDiv.innerHTML = products.map(p => `
    <div class="stat-card">
      <div class="stat-card-number">${p.scans}</div>
      <div class="stat-card-label">${p.name} Scans</div>
    </div>
  `).join('') + `<div class="stat-card"><div class="stat-card-number">${totalScans}</div><div class="stat-card-label">Total Scans</div></div>`;

  const tbody = document.getElementById('analytics-table-body');
  tbody.innerHTML = products.map(p => `
    <tr>
      <td><strong>${p.name}</strong></td>
      <td style="font-size:0.8rem;color:var(--sky-blue);">plantcarefertilizers.com/products/${p.slug}</td>
      <td><strong>${p.scans}</strong></td>
      <td style="color:#7a9880;font-size:0.82rem;">Just now</td>
    </tr>
  `).join('');
}

function downloadAdminQR(id, slug) {
  const c = document.getElementById('qr-' + id);
  const a = document.createElement('a');
  a.download = 'PlantCare-' + slug + '-QR.png';
  a.href = c.toDataURL('image/png'); a.click();
  showToast('QR downloaded!');
}

function copyProductLink(slug) {
  navigator.clipboard.writeText('https://plantcarefertilizers.com/products/' + slug).then(() => showToast('Link copied!'));
}

function openAddModal() {
  editId = null;
  document.getElementById('modal-title').textContent = 'Add Product';
  document.getElementById('modal-name').value = '';
  document.getElementById('modal-desc').value = '';
  document.getElementById('modal-mrp').value = '';
  document.getElementById('modal-weight').value = '';
  document.getElementById('modal-slug').value = '';
  document.getElementById('product-modal').classList.add('open');
}

function openEditModal(id) {
  const products = getProducts();
  const p = products.find(x => x.id === id);
  if (!p) return;
  editId = id;
  document.getElementById('modal-title').textContent = 'Edit Product';
  document.getElementById('modal-name').value = p.name;
  document.getElementById('modal-desc').value = p.desc;
  document.getElementById('modal-mrp').value = p.mrp;
  document.getElementById('modal-weight').value = p.weight;
  document.getElementById('modal-slug').value = p.slug;
  document.getElementById('product-modal').classList.add('open');
}

function closeModal() { document.getElementById('product-modal').classList.remove('open'); }

function saveProduct() {
  const name = document.getElementById('modal-name').value.trim();
  const desc = document.getElementById('modal-desc').value.trim();
  const mrp = parseInt(document.getElementById('modal-mrp').value);
  const weight = parseInt(document.getElementById('modal-weight').value);
  const slug = document.getElementById('modal-slug').value.trim().toLowerCase().replace(/\s+/g,'-');
  if (!name || !slug) { showToast('Name and slug are required'); return; }
  const products = getProducts();
  if (editId) {
    const idx = products.findIndex(p => p.id === editId);
    if (idx > -1) { products[idx] = { ...products[idx], name, desc, mrp, weight, slug }; }
  } else {
    const newId = Math.max(...products.map(p => p.id)) + 1;
    products.push({ id: newId, name, desc, mrp: mrp||0, weight: weight||0, slug, img:'../public/images/plantcare-logo.png', scans: 0 });
  }
  saveProducts(products);
  closeModal();
  renderProducts();
  showToast(editId ? 'Product updated!' : 'Product added!');
}

function deleteProduct(id) {
  if (!confirm('Delete this product?')) return;
  const products = getProducts().filter(p => p.id !== id);
  saveProducts(products);
  renderProducts();
  showToast('Product deleted');
}

function logout() {
  sessionStorage.removeItem('pc_admin');
  window.location.href = 'login.html';
}

function showToast(msg) {
  let t = document.getElementById('admin-toast');
  if (!t) { t = document.createElement('div'); t.id = 'admin-toast'; t.className = 'toast'; document.body.appendChild(t); }
  t.textContent = msg; t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 3000);
}

// Click outside modal to close
document.getElementById('product-modal').addEventListener('click', function(e) {
  if (e.target === this) closeModal();
});

// Init
renderDashboard();
</script>
</body>
</html>
